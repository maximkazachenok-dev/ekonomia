<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Экономия денег</title>
    <meta name="description" content="Семейный бюджет: сколько можно потратить сегодня" />
    <meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121412" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Экономия" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />
    <!-- Новое имя файла: iPhone запоминает иконку сайта и не перезапрашивает её по старому адресу -->
    <link rel="apple-touch-icon" href="icons/home-icon-180.png" sizes="180x180" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="modulepreload" href="https://unpkg.com/htm@3.1.1/preact/standalone.module.js" crossorigin />
    <!-- Firebase подгружается после проверки настроек; заранее начинаем скачивать, чтобы не ждать по очереди -->
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js" crossorigin />
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js" crossorigin />
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js" crossorigin />
  </head>
  <body>
    <div id="root"><div class="splash"><div class="onb__logo">💰</div></div></div>
    <noscript>Для работы приложения нужен JavaScript.</noscript>
    <script type="module" src="js/app.js"></script>
    <script>
      // Если модули не загрузились (плохая сеть при первом открытии) — не висим на заставке
      setTimeout(function () {
        if (window.__appStarted) return;
        document.getElementById('root').innerHTML =
          '<div class="onb" style="justify-content:center;text-align:center"><div class="onb__logo">📶</div>' +
          '<p class="onb__text">Не удалось загрузить приложение. Проверьте интернет.</p>' +
          '<button class="btn btn--primary btn--block btn--lg" onclick="location.reload()">Обновить</button></div>';
      }, 8000);
    </script>
  </body>
</html>
